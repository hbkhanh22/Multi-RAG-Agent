name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (no models) + migrations on Postgres/pgvector
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag_ci_pw
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_PG_URL: postgresql+psycopg://rag:rag_ci_pw@localhost:5432/rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - name: Install runtime deps (no torch)
        run: pip install -r requirements-runtime.txt pytest "moto[s3]>=5"
      - name: Byte-compile
        run: python -m compileall -q config src api scripts alembic
      - name: Alembic migrations, run twice (must be idempotent)
        env:
          DATABASE_URL: ${{ env.TEST_PG_URL }}
        run: |
          alembic upgrade head
          alembic upgrade head
      - name: Tests that need no local models
        run: pytest -q -m "not models"

  docker:
    name: Build images (push to GHCR on main)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "api=${repo}-api" >> "$GITHUB_OUTPUT"
          echo "web=${repo}-web" >> "$GITHUB_OUTPUT"
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.names.outputs.api }}:${{ github.sha }}
            ${{ steps.names.outputs.api }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.names.outputs.web }}:${{ github.sha }}
            ${{ steps.names.outputs.web }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Compose file is valid
        run: POSTGRES_PASSWORD=x MINIO_ROOT_PASSWORD=xxxxxxxx docker compose -f docker-compose.yml --env-file /dev/null config -q
        env:
          NVIDIA_API_KEY: dummy

  eval-gate:
    # Retrieval quality gate. Needs the models, the (non-redistributable) documents and
    # an NVIDIA key, so it runs on a self-hosted runner that has them, on demand.
    name: Retrieval eval gate (self-hosted)
    if: github.event_name == 'workflow_dispatch' && vars.EVAL_RUNNER_ENABLED == 'true'
    runs-on: [self-hosted, rag-eval]
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Retrieval eval (sport + tech)
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python -m src.evaluation.run --retrieval-only --dataset evals/datasets/sport.jsonl --out evals/results/ci-sport
          python -m src.evaluation.run --retrieval-only --dataset evals/datasets/tech.jsonl --out evals/results/ci-tech
      - name: Gate (fail if quality regressed)
        run: python scripts/eval_gate.py evals/results/ci-sport evals/results/ci-tech --min-hit 0.90 --min-mrr 0.80
