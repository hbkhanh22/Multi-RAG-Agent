# Agent Configurations - Google LLM Models

agents:
  router:
    name: "Query Router"
    description: "Routes queries to appropriate specialist agents"
    model: "gemini-2.0-flash"
    temperature: 0.0
    max_tokens: 500
    system_prompt: |
      You are an intelligent query router. Classify incoming queries into domains:
      - finance: stocks, investment, economics, financial reports, trading, cryptocurrencies
      - tech: programming, AI, software, hardware, cloud, DevOps, cybersecurity
      - general: history, science, culture, general knowledge, news, entertainment
      - multi: queries spanning multiple domains
      
      Respond with JSON format ONLY (no other text):
      {
        "route": "finance|tech|general|multi",
        "agents": ["finance", "tech", "general"],
        "confidence": 0.95,
        "reasoning": "brief explanation"
      }

  finance_agent:
    name: "Finance RAG Agent"
    description: "Specialist agent for financial queries"
    domain: "finance"
    model: "gemini-2.0-flash"
    temperature: 0.0
    top_k_retrieval: 10
    top_k_rerank: 4
    system_prompt: |
      You are a financial analyst assistant. Answer questions using the provided financial data.
      Be precise with numbers and cite sources.
      If data is insufficient, clearly state the limitations.

  tech_agent:
    name: "Tech RAG Agent"
    description: "Specialist agent for technical queries"
    domain: "tech"
    model: "gemini-2.0-flash"
    temperature: 0.0
    top_k_retrieval: 10
    top_k_rerank: 4
    system_prompt: |
      You are a technical expert assistant. Provide accurate technical information.
      Include code examples when relevant.
      Explain concepts clearly for different expertise levels.

  general_agent:
    name: "General Knowledge Agent"
    description: "Specialist agent for general queries"
    domain: "general"
    model: "gemini-2.0-flash"
    temperature: 0.1
    top_k_retrieval: 10
    top_k_rerank: 4
    system_prompt: |
      You are a knowledgeable assistant covering history, science, culture, and general topics.
      Provide comprehensive and accurate answers with context.

  supervisor:
    name: "Supervisor Agent"
    description: "Orchestrates multiple specialist agents for complex queries"
    model: "gemini-2.0-flash"
    temperature: 0.1
    max_iterations: 3
    system_prompt: |
      You are a supervisor coordinating multiple specialist agents.
      Delegate tasks appropriately and synthesize their responses.
      Ensure comprehensive coverage of the user's question.

  synthesizer:
    name: "Answer Synthesizer"
    description: "Combines agent outputs into a unified answer"
    model: "gemini-2.0-flash"
    temperature: 0.0
    max_tokens: 2000
    system_prompt: |
      You are a synthesis expert. Combine responses from multiple sources into one coherent answer.
      - Merge related information
      - Remove redundancy
      - Maintain source attribution
      - Flag contradictions
      - Present in clear, structured format

# Retrieval Configuration
retrieval:
  embedding_model: "gemini-embedding-001"
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-12-v2"
  chunk_size: 512
  chunk_overlap: 64
  hybrid_weights:
    vector: 0.6
    bm25: 0.4
  ensemble_weights:
    finance: 0.7
    tech: 0.7
    general: 0.7

# Model Parameters
models:
  default_model: "gemini-2.0-flash"
  fast_model: "gemini-1.5-flash"
  powerful_model: "gemini-2.0-flash"
  embedding_model: "gemini-embedding-001"
  embedding_dimension: 768
