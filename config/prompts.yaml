# Prompt Templates for Multi-RAG System

prompts:
  # Router Prompts
  router_classification: |
    Classify this query into one or more domains:
    - finance: stocks, investment, economics, financial reports, trading
    - tech: programming, AI, software, hardware, cloud, cybersecurity
    - general: history, science, culture, general knowledge
    - multi: spans multiple domains

    Query: {query}

    Respond with JSON only:
    {
      "route": "finance|tech|general|multi",
      "confidence": 0.0-1.0,
      "agents": ["finance", "tech"]
    }

  # RAG Agent Prompts
  rag_generation: |
    Answer the question based on the provided context. 
    If the context doesn't contain enough information, say so clearly.
    Always cite sources.

    Context:
    {context}

    Question: {query}

    Answer:

  rag_with_citations: |
    Using the following documents, answer the question with citations.
    Format citations as [Source N] where N is the document number.

    Documents:
    {documents}

    Question: {query}

    Answer with citations:

  # Query Expansion Prompts
  hyde_expansion: |
    You are an expert in generating hypothetical documents.
    Given a query, generate a hypothetical document that would answer it.
    This helps improve semantic search.

    Query: {query}

    Hypothetical document:

  multi_query_expansion: |
    Generate 3 different phrasings of this query to improve search coverage.
    Each phrasing should capture different aspects or terminology.

    Original query: {query}

    Alternative queries:
    1. 
    2. 
    3.

  # Reranking Prompts
  relevance_scoring: |
    Rate how relevant this document is to the query on a scale of 1-10.
    Consider both semantic relevance and information usefulness.

    Query: {query}
    Document: {document}

    Relevance score (1-10):
    Explanation:

  # Supervisor Prompts
  supervisor_planning: |
    You are coordinating multiple specialist agents.
    Analyze this complex query and create a plan.
    Specify which agents to involve and what each should investigate.

    Query: {query}
    Available agents: {agents}

    Execution plan:
    {plan}

  supervisor_synthesis: |
    Combine these agent responses into a comprehensive answer.

    Query: {query}

    Agent Responses:
    {responses}

    Synthesized answer:

  # Synthesizer Prompts
  final_synthesis: |
    Create a final, unified answer combining all sources.
    Eliminate redundancy, resolve conflicts, maintain citations.

    Query: {query}

    Source Responses:
    {sources}

    Final Answer:

  final_answer_format: |
    Format the answer as follows:

    **Answer:**
    [Main answer content]

    **Key Points:**
    - Point 1
    - Point 2
    - Point 3

    **Sources:**
    [List of sources with confidence]

    **Limitations:**
    [Any data or knowledge limitations]

  # Guardrail Prompts
  hallucination_check: |
    Check if this answer is grounded in the provided context.
    Flag any claims not supported by sources.

    Context: {context}
    Answer: {answer}

    Hallucination check:

  toxicity_check: |
    Review this response for potential toxicity or bias.
    Flag any concerning language or perspectives.

    Response: {response}

    Assessment:

  # Domain-Specific Prompts
  finance_analysis: |
    Analyze the financial data with expert perspective.
    Include key metrics, trends, risks, and opportunities.

    Data:
    {data}

    Analysis:

  tech_explanation: |
    Explain this technical concept clearly.
    Include relevant code examples if applicable.
    Use analogies to help understanding.

    Concept: {concept}
    Context: {context}

    Explanation:

  general_research: |
    Provide comprehensive research-based answer.
    Include historical context, current status, and implications.

    Topic: {topic}
    Sources: {sources}

    Response:

# Prompt Parameters
parameters:
  max_context_length: 8000
  max_answer_length: 2000
  min_confidence: 0.7
  citation_format: "[Source N]"
  language: "en"
  tone: "professional"
