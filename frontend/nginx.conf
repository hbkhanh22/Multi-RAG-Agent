# nginx: static React app + reverse proxy to the API (single origin, SSE-safe).
upstream api_upstream {
    server api:8000;
    keepalive 16;
}

# per-IP request rate for the API at the edge (the app has its own per-client limit too)
limit_req_zone $binary_remote_addr zone=api_rl:10m rate=10r/s;

server {
    listen 8080;
    server_name _;
    client_max_body_size 50m;          # document uploads (MAX_UPLOAD_MB)
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /usr/share/nginx/html;

    location /api/ {
        limit_req zone=api_rl burst=40 nodelay;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # Server-Sent Events: stream tokens as they come, keep long answers alive
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /health/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # metrics stay internal (Prometheus scrapes api:8000 directly)
    location = /metrics { return 404; }

    # `expires` (not add_header) so the server-level security headers are inherited
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
